apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redis-platform.fullname" . }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "redis-platform.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "redis-platform.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: {{ .Values.redis.port }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-platform.fullname" . }}-redis
spec:
  type: ClusterIP
  selector:
    app: {{ include "redis-platform.fullname" . }}-redis
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
