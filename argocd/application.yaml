apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Eyedeasforvictory/redis-platform-lab.git
    targetRevision: main
    path: helm/redis-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
